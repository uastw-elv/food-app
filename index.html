<style>
/* Layout: Kopf mit Suche + Filterleiste, darunter Kartenraster; Detail als Seitenblatt (Dialog). */
:root {
  --bg: #f5f7f4; --surface: #ffffff; --ink: #18211b; --muted: #5d6a61; --line: #dde4de;
  --accent: #2f7a4f; --accent-ink: #ffffff; --accent-soft: #e3f0e7;
  --warn: #a15c00; --warn-soft: #fbefdc; --bad: #b3261e; --bad-soft: #fbe5e3;
  --ig1: #f58529; --ig2: #dd2a7b; --ig3: #8134af;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #1a211d; --ink: #e8eee9; --muted: #9aa89f; --line: #2c3630;
  --accent: #6cc48f; --accent-ink: #0d1a12; --accent-soft: #1f3327;
  --warn: #f0b35a; --warn-soft: #3a2c15; --bad: #f28b82; --bad-soft: #3b1f1d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #1a211d; --ink: #e8eee9; --muted: #9aa89f; --line: #2c3630;
  --accent: #6cc48f; --accent-ink: #0d1a12; --accent-soft: #1f3327;
  --warn: #f0b35a; --warn-soft: #3a2c15; --bad: #f28b82; --bad-soft: #3b1f1d; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem) }
.sub { color: var(--muted); margin: 4px 0 16px }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
input[type=search], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px }
input[type=search] { flex: 1 1 260px; min-width: 0 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
details.filters { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px }
details.filters > summary { cursor: pointer; padding: 10px 0; font-weight: 600 }
.dim { display: grid; grid-template-columns: 130px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line) }
.dim b { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 6px }
.fgroup { display: grid; grid-template-columns: 7.5em 1fr; gap: 6px 10px; align-items: start; margin: 0 0 8px }
.flabel { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 7px }
@media (max-width: 480px) { .fgroup { grid-template-columns: 1fr; gap: 4px } .flabel { padding-top: 0 } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0 }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 10px;
  font: 500 13px var(--body); cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.chip small { color: inherit; opacity: .7; font-variant-numeric: tabular-nums }
.meta-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin: 16px 0 10px; color: var(--muted) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; text-align: left; padding: 0; color: inherit; font: inherit }
.card:hover { border-color: var(--accent) }
.thumb { aspect-ratio: 4/3; width: 100%; max-width: 100%; object-fit: cover; background: var(--accent-soft); display: block }
.ph { aspect-ratio: 4/3; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
  font: 700 2.4rem var(--display) }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1 }
.card h3 { font-size: 1.02rem; line-height: 1.25 }
.facts { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: auto }
.pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; background: var(--accent-soft); color: var(--accent) }
.pill.warn { background: var(--warn-soft); color: var(--warn) } .pill.bad { background: var(--bad-soft); color: var(--bad) }
.top { position: relative } .badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; gap: 6px }
.ig { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(45deg, var(--ig1), var(--ig2), var(--ig3)); color: #fff; flex: none }
.ig svg { width: 16px; height: 16px }
.stars { color: var(--warn); letter-spacing: 1px; font-size: 13px }
button.more { margin: 20px auto 0; display: block }
.btn { font: 600 14px var(--body); border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
dialog { border: none; padding: 0; width: min(860px, 100vw); max-width: 100vw; max-height: 100dvh; border-radius: 18px; background: var(--surface); color: var(--ink) }
dialog::backdrop { background: rgba(0,0,0,.45) }
.dlg { padding: 18px max(18px, env(safe-area-inset-left, 0px)) 28px; display: grid; gap: 18px }
.dlg-head { display: flex; justify-content: space-between; gap: 12px; align-items: start }
.hero { width: 100%; max-height: 340px; object-fit: cover; border-radius: 12px; display: block }
.credit { font-size: 12px; color: var(--muted) } .credit a { color: inherit }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 22px }
@media (max-width: 720px) { .cols { grid-template-columns: 1fr } .dim { grid-template-columns: 1fr } }
.box h3 { font-size: 1rem; margin-bottom: 8px }
.ing { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px }
.ing li { padding: 4px 0; border-bottom: 1px dashed var(--line) }
.role { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 12px 0 4px }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 10px } ol.steps li::marker { font-weight: 700; color: var(--accent) }
.nut { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; font-variant-numeric: tabular-nums }
.nut div { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center } .nut b { display: block; font-size: 1.1rem }
.nut span { font-size: 12px; color: var(--muted) }
table.sport { border-collapse: collapse; width: 100%; font-size: 13px } table.sport td, table.sport th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
.rate { background: var(--bg); border-radius: 12px; padding: 14px; display: grid; gap: 10px }
.rate .starsbtn button { background: none; border: none; font-size: 26px; color: var(--line); cursor: pointer; padding: 0 2px }
.rate .starsbtn button.on { color: var(--warn) }
.note { font-size: 13px; color: var(--muted) }
textarea { width: 100%; min-height: 60px }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s } }
.book { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--warn); color: #fff; flex: none }
.book svg { width: 16px; height: 16px }
.sb { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none }
.sb svg { width: 16px; height: 16px } .sb.wiki { background: #4a5560 } .sb.blog { background: #2f7a4f } .sb.gk { background: #b5562a }
.chip .ig, .chip .book, .chip .sb { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; vertical-align: middle; margin-right: 2px }
.chip .ig svg, .chip .book svg, .chip .sb svg { width: 12px; height: 12px }
.tabs { display: flex; gap: 6px; margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; width: fit-content; max-width: 100% }
.tabs button { font: 600 14px var(--body); border: none; background: transparent; color: var(--muted); border-radius: 9px; padding: 8px 14px; cursor: pointer; white-space: nowrap }
.tabs button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink) }
.tabs .n { font-variant-numeric: tabular-nums; opacity: .8 }
/* Wischen */
.swipe-top { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px }
.swipe-top select { flex: 1 1 160px; min-width: 0 }
.panel .dlg-head { flex-wrap: wrap }
.deck { position: relative; height: min(58dvh, 520px); max-width: 420px; margin: 0 auto }
.scard { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  display: flex; flex-direction: column; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; box-shadow: 0 8px 24px rgba(0,0,0,.08) }
.scard.back { transform: scale(.95) translateY(12px); opacity: .7; pointer-events: none }
.scard .simg { flex: 1 1 50%; min-height: 0; object-fit: cover; width: 100%; background: var(--accent-soft); pointer-events: none }
.scard .sph { flex: 1 1 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent-soft), var(--bg)); color: var(--accent); font: 700 4rem var(--display) }
.scard .sbody { padding: 14px 16px 16px; display: grid; gap: 8px }
.scard h2 { font-size: 1.35rem; line-height: 1.2 }
.stamp { position: absolute; top: 18px; padding: 4px 12px; border: 3px solid; border-radius: 10px; font: 700 1.3rem var(--display); opacity: 0; text-transform: uppercase; background: var(--surface) }
.stamp.yes { left: 18px; color: var(--accent); transform: rotate(-12deg) } .stamp.no { right: 18px; color: var(--bad); transform: rotate(12deg) }
.sbadges { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: flex-end; gap: 6px; pointer-events: none }
.swipe-btns { display: flex; justify-content: center; gap: 18px; margin-top: 16px; align-items: center }
.round { width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 26px; cursor: pointer; display: grid; place-items: center; color: var(--ink) }
.round.no { color: var(--bad) } .round.yes { color: var(--accent) } .round.small { width: 46px; height: 46px; font-size: 18px; color: var(--muted) }
.round:disabled { opacity: .4; cursor: default }
.empty { text-align: center; padding: 40px 16px; color: var(--muted) }
/* Auswahl & Einkaufsliste */
.list-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; align-items: start }
@media (max-width: 820px) { .list-grid { grid-template-columns: 1fr } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; min-width: 0 }
.panel h2 { font-size: 1.15rem }
.pick { border-top: 1px solid var(--line); padding-top: 10px }
.pick summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; font-weight: 600; list-style: none }
.pick summary::-webkit-details-marker { display: none }
.pick .acts { display: flex; gap: 6px; flex: none }
.iconbtn { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 8px; font: 500 12px var(--body); cursor: pointer }
.shop h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 12px 0 4px; font-family: var(--body) }
.shop ul { list-style: none; margin: 0; padding: 0 }
.shop li { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); align-items: start }
.shop li input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent) }
.shop li.done .what { text-decoration: line-through; color: var(--muted) }
.what b { font-weight: 600 } .for { display: block; font-size: 12px; color: var(--muted) }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px }
.persons { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; flex-wrap: wrap }
.persons output { min-width: 2.2em; text-align: center; font-weight: 700; font-size: 1.15rem }
.persons .round { width: 44px; height: 44px; font-size: 1.3rem }
.pick .pp { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .95rem }
.pick .pp select { min-height: 44px; font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card, transparent); color: inherit }
.imp-row { margin: 4px 0 12px }
.imp label { display: block; font-weight: 600; margin: 12px 0 4px }
.imp input[type=url], .imp input[type=text], .imp textarea { width: 100%; box-sizing: border-box; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px }
.imp textarea { min-height: 160px; resize: vertical }
.imp .hint { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0 }
.imp .warn { border-left: 4px solid #b5562a; padding: 6px 10px; background: var(--surface) }
.imp .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px }
.imp .acts .btn { min-height: 44px }
.imp ul, .imp ol { padding-left: 20px; margin: 4px 0 }
.imp .err { color: #b3261e } @media (prefers-color-scheme: dark) { .imp .err { color: #ffb4ab } }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer }
</style>

<body>
<div class="wrap">
  <header>
    <h1>Rezeptkatalog</h1>
    <p class="sub" id="sub">Lade Rezepte …</p>
    <nav class="tabs" aria-label="Ansicht">
      <button type="button" data-tab="katalog" aria-pressed="true">Katalog</button>
      <button type="button" data-tab="wischen" aria-pressed="false">Wischen</button>
      <button type="button" data-tab="liste" aria-pressed="false">Auswahl &amp; Einkauf <span class="n" id="pickN"></span></button>
      <button type="button" data-tab="saison" aria-pressed="false">Saison</button>
    </nav>
  </header>
  <section id="v-katalog">
    <div class="bar">
      <input type="search" id="q" placeholder="Gericht oder Zutat suchen, z. B. Linsen, Strudel" aria-label="Suchen">
      <select id="sort" aria-label="Sortieren">
        <option value="az">A–Z</option><option value="prot">Meiste Proteine</option><option value="kcal">Wenigste kcal</option>
        <option value="time">Schnellste zuerst</option><option value="rating">Beste Bewertung</option>
      </select>
      <select id="view" aria-label="Status">
        <option value="aktiv">Ohne aussortierte</option><option value="all">Alle</option>
        <option value="unrated">Noch nicht bewertet</option><option value="pruefen">Zu prüfen</option><option value="out">Aussortiert</option>
      </select>
    </div>
    <details class="filters" id="filters"><summary>Filter <span class="n" id="filterN"></span></summary><div id="dims"></div></details>
    <div class="meta-row"><span id="count"></span><button class="btn" id="reset" type="button">Filter zurücksetzen</button></div>
    <div class="imp-row"><button class="btn" id="impOpen" type="button"><span aria-hidden="true">＋ </span>Rezept aus Instagram hinzufügen</button></div>
    <main class="grid" id="grid" aria-live="polite"></main>
    <button class="btn more" id="more" type="button" hidden>Mehr anzeigen</button>
  </section>
  <section id="v-wischen" hidden>
    <div class="swipe-top">
      <label for="theme" class="note" style="font-weight:600">Thema</label>
      <select id="theme"></select>
      <button class="btn" type="button" id="reshuffle">Neu mischen</button>
      <span class="note" id="deckInfo" aria-live="polite"></span>
    </div>
    <div class="deck" id="deck"></div>
    <div class="swipe-btns">
      <button class="round small" type="button" id="undo" aria-label="Letzte Entscheidung zurücknehmen" title="Zurück">↶</button>
      <button class="round no" type="button" id="nope" aria-label="Diesmal nicht, kommt später wieder (Pfeil links)" title="Später">✕</button>
      <button class="round yes" type="button" id="like" aria-label="In die Auswahl (Pfeil rechts)" title="Nehmen">♥</button>
      <button class="round small" type="button" id="info" aria-label="Rezept öffnen" title="Details">i</button>
    </div>
    <p class="note" style="text-align:center">Nach rechts wischen = nehmen, nach links = diesmal nicht (kommt beim nächsten Mischen wieder). Antippen öffnet das Rezept.</p>
  </section>
  <section id="v-saison" hidden aria-label="Saisonkalender Obst und Gemüse"></section>
  <section id="v-liste" hidden>
    <div class="list-grid">
      <div class="panel"><div class="dlg-head"><h2 id="pickHead">Deine Auswahl</h2><button class="btn" type="button" id="clearPicks">Leeren</button></div>
        <div id="pickList"></div></div>
      <div class="panel shop"><div class="dlg-head"><h2>Einkaufsliste</h2>
        <div class="row-btns"><button class="btn" type="button" id="copyList">Kopieren</button><button class="btn" type="button" id="uncheck">Haken entfernen</button></div></div>
        <div class="persons" role="group" aria-labelledby="persLbl"><span id="persLbl">Für</span>
          <button class="round small" type="button" id="persMinus" aria-label="Eine Person weniger">−</button>
          <output id="persN" aria-live="polite">2</output>
          <button class="round small" type="button" id="persPlus" aria-label="Eine Person mehr">+</button>
          <span id="persTxt">Personen</span></div>
        <p class="note" id="persNote" style="margin:0 0 6px"></p>
        <p class="note" id="copyMsg" aria-live="polite" style="margin:0"></p>
        <div id="shopList"></div></div>
    </div>
  </section>
</div>
<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

<script>
const IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
const BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>';
const WIKI = '<svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="17" text-anchor="middle" font-size="15" font-weight="700" font-family="Georgia,serif" fill="currentColor">W</text></svg>';
const BLOG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const SPOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="7" rx="4" ry="5"/><path d="M12 12v9"/></svg>';
const SRC = {instagram: ["ig", IG, "Instagram"], kochbuch: ["book", BOOK, "Kochbuch „Weird Times Dining“"], wikibooks: ["sb wiki", WIKI, "Wikibooks"],
  blog: ["sb blog", BLOG, "Food-Blog"], gutekueche: ["sb gk", SPOON, "gutekueche.at"]};
const srcIcon = (k, size) => { const x = SRC[k]; if (!x) return "";
  return `<span class="${x[0]}" title="Quelle: ${x[2]}" role="img" aria-label="Quelle: ${x[2]}"${size ? ` style="display:inline-grid;vertical-align:middle;width:${size}px;height:${size}px"` : ""}>${x[1]}</span>`; };
const srcBadge = (r, size) => srcIcon(r.src, size);
const DIMS = [["ernaehrungsform","Ernährung"],["gang","Gang & Anlass"],["gerichtart","Hauptzutat & Gerichtart"],["naehrwert","Nährwerte"],
  ["aufwand","Aufwand"],["kueche","Küche"],["quelle","Quelle"],["geschmack","Geschmack"],["kosten","Kosten"],["anlass","Anlass"]];
const SPORT = {radfahren:"Radfahren", laufen:"Laufen", schwimmen:"Schwimmen", krafttraining:"Kraft"};
const VERDICT = [["behalten","Behalten"],["nochmal_kochen","Nochmal kochen"],["ueberarbeiten","Überarbeiten"],["aussortieren","Aussortieren"]];

function filtered() {
  const q = $("q").value.trim().toLowerCase(), v = $("view").value;
  const byDim = {}; Object.keys(sel).forEach(t => (byDim[t.split(":")[0]] ||= []).push(t));
  let out = R.filter(r => {
    if (q && !q.split(/\s+/).every(w => r._s.includes(w))) return false;
    // ODER innerhalb einer Dimension, UND zwischen Dimensionen; Ernährungsformen gelten immer zusammen (vegetarisch + laktosefrei)
    for (const d in byDim) if (!(d === "ernaehrungsform" ? byDim[d].every(t => r.tags.includes(t)) : byDim[d].some(t => r.tags.includes(t)))) return false;
    const rt = ratings[r.id];
    if (v === "aktiv" && rt && rt.verdict === "aussortieren") return false;
    if (v === "unrated" && rt) return false;
    if (v === "pruefen" && r.status !== "pruefen") return false;
    if (v === "out" && !(rt && rt.verdict === "aussortieren")) return false;
    return true;
  });
  const s = $("sort").value, n = (r, i, def) => r.n ? r.n[i] : def;
  if (s === "prot") out.sort((a, b) => n(b, 1, -1) - n(a, 1, -1));
  if (s === "kcal") out.sort((a, b) => n(a, 0, 1e9) - n(b, 0, 1e9));
  if (s === "time") out.sort((a, b) => (a.tm || 1e9) - (b.tm || 1e9));
  if (s === "rating") out.sort((a, b) => ((ratings[b.id] || {}).stars || 0) - ((ratings[a.id] || {}).stars || 0));
  return out;
}

/* ---------- Auswahl (pro Gerät gemerkt) ---------- */

let persons = 2, perDish = {};
try { persons = Math.min(20, Math.max(1, +localStorage.getItem("rk-persons") || 2)); perDish = JSON.parse(localStorage.getItem("rk-perdish") || "{}") } catch (e) {}
const savePersons = () => { try { localStorage.setItem("rk-persons", persons); localStorage.setItem("rk-perdish", JSON.stringify(perDish)) } catch (e) {} };
const pplOf = r => perDish[r.id] || persons;
const factorOf = r => r.sv ? pplOf(r) / r.sv : 1;
const FR = [[.125, "⅛"], [.25, "¼"], [1 / 3, "⅓"], [.5, "½"], [2 / 3, "⅔"], [.75, "¾"]];
function fmtQ(x) {
  if (x >= 10) return String(Math.round(x));
  const w = Math.floor(x), rest = x - w;
  let best = [0, ""], d = rest; FR.forEach(f => { if (Math.abs(rest - f[0]) < d) { d = Math.abs(rest - f[0]); best = f; } });
  if (1 - rest < d) return String(w + 1);
  return w ? (best[1] ? w + best[1] : String(w)) : (best[1] || "⅛");
}
const UF = {"½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": .125};
const num = t => UF[t] ?? (t.includes("/") ? t.split("/")[0] / t.split("/")[1] : parseFloat(t.replace(",", ".")));
const NUM = "(\\d+\\s?[½¼¾⅓⅔⅛]|\\d+/\\d+|\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔⅛])";
const QRE = new RegExp("^((?:ca\\.|etwa|about|approx\\.?)\\s*)?" + NUM + "(\\s*[–-]\\s*" + NUM + ")?");
function scaleRaw(s, f) {
  if (Math.abs(f - 1) < .01) return s;
  return s.replace(QRE, (m, pre, a, rng, b) => {
    const v = t => { const mm = t.match(/^(\d+)\s?([½¼¾⅓⅔⅛])$/); return mm ? +mm[1] + UF[mm[2]] : num(t); };
    return (pre || "") + fmtQ(v(a) * f) + (rng ? "–" + fmtQ(v(b) * f) : "");
  });
}
const savePicks = () => { try { localStorage.setItem("rk-picks", JSON.stringify(picks)); localStorage.setItem("rk-checked", JSON.stringify(checked)) } catch (e) {} };
function togglePick(id, on) {
  const has = picks.includes(id), want = on === undefined ? !has : on;
  if (want && !has) picks.push(id); if (!want && has) picks = picks.filter(x => x !== id);
  savePicks(); $("pickN").textContent = picks.length ? `(${picks.length})` : "";
}

const THEMES = [["alle","Alles"],["filter","Wie im Katalog gefiltert"],["aufwand:schnell","Schnell"],["naehrwert:proteinreich","Proteinreich"],
  ["naehrwert:kalorienarm","Kalorienarm"],["ernaehrungsform:vegetarisch","Vegetarisch"],["ernaehrungsform:vegan","Vegan"],["ernaehrungsform:vegan+naehrwert:proteinreich","Vegan & proteinreich"],
  ["ernaehrungsform:vegetarisch+gang:hauptgericht","Vegetarische Hauptgerichte"],["ernaehrungsform:vegan+aufwand:schnell","Vegan & schnell"],["ernaehrungsform:laktosefrei","Laktosefrei"],["ernaehrungsform:laktosefrei+gang:hauptgericht","Laktosefreie Hauptgerichte"],
  ["gerichtart:braten","Braten"],["gerichtart:braten+ernaehrungsform:vegan","Vegane Braten"],["gang:rad_snack","Radfahren: unterwegs"],["kosten:guenstig","Günstig"],
  ["gang:hauptgericht","Hauptgericht"],["gang:suppe","Suppe"],["gang:dessert","Dessert"],["gang:gebaeck","Gebäck & Kuchen"],
  ["kueche:italienisch","Italienisch"],["kueche:asiatisch","Asiatisch"],["kueche:indisch","Indisch"],["quelle:instagram","Aus Instagram"],["quelle:kochbuch","Aus dem Kochbuch"],["quelle:blog","Von Food-Blogs"],["quelle:gutekueche","Von gutekueche.at"]];
let deck = [], pos = 0, hist = [];
function initSwipe() {
  $("theme").innerHTML = THEMES.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  try { const t = localStorage.getItem("rk-theme"); if (t && THEMES.some(x => x[0] === t)) $("theme").value = t } catch (e) {}
  $("theme").onchange = () => { try { localStorage.setItem("rk-theme", $("theme").value) } catch (e) {} newDeck(); };
  $("reshuffle").onclick = newDeck;
  $("like").onclick = () => decide(true); $("nope").onclick = () => decide(false);
  $("undo").onclick = undo; $("info").onclick = () => deck[pos] && openR(deck[pos]);
  $("pickN").textContent = picks.length ? `(${picks.length})` : "";
}
function newDeck() {
  const th = $("theme").value;
  let pool = th === "filter" ? filtered() : R.filter(r => th === "alle" || th.split("+").every(t => r.tags.includes(t)));
  // nur kochbare Rezepte; Getränke & Saucen (nicht im Wochenplan) nur über den Katalog-Filter
  pool = pool.filter(r => r.ing.length >= 2 && r.st.length && (th === "filter" || r.status !== "pruefen") && !(ratings[r.id] && ratings[r.id].verdict === "aussortieren") && !picks.includes(r.id)
    && (th === "filter" || r.wk || th === "gang:rad_snack"));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  deck = pool; pos = 0; hist = []; drawDeck();
}
function scard(r, back) {

  const tags = r.tags.filter(t => /^(gang|kueche|aufwand|naehrwert|ernaehrungsform):/.test(t) && !/wenige_zutaten|einfach/.test(t)).slice(0, 4)
    .map(t => `<span class="pill">${esc(L[t] || t)}</span>`).join(" ");
  return `<div class="scard${back ? " back" : ""}" ${back ? 'aria-hidden="true"' : `id="top" role="group" aria-label="${esc(r.t)}"`}>
    ${img ? `<img class="simg" src="${esc(img)}" alt="" draggable="false" onerror="this.style.visibility='hidden'">` : `<div class="sph" aria-hidden="true">${esc(r.t[0] || "?")}</div>`}
    <div class="sbadges">${srcBadge(r)}</div>

    <div class="hint note"><b>So geht's:</b> In Instagram beim Beitrag auf ··· und „Link kopieren“. Dann „mehr“ antippen, die Beschreibung lange drücken und kopieren. Steht das Rezept nur im Video, mach Screenshots von Zutaten und Schritten.</div>
    <label for="impUrl">Link zum Beitrag</label>
    <input type="url" id="impUrl" inputmode="url" autocomplete="off" placeholder="https://www.instagram.com/reel/…" value="${esc(p.url || "")}">
    <div id="impDup" aria-live="polite"></div>
    <label for="impTxt">Beschreibung (Text unter dem Video)</label>
    <textarea id="impTxt" placeholder="Hier die Beschreibung einfügen">${esc(p.text || "")}</textarea>
    <div id="impImgWrap" ${impLim && impLim.images ? "" : "hidden"}><label for="impImg">Screenshots (optional, bis ${impLim && impLim.images ? impLim.images.maxCount : 0})</label>
      <input type="file" id="impImg" accept="${esc(impLim && impLim.images ? impLim.images.mediaTypes.join(",") : "image/*")}" multiple></div>
    <div class="acts"><button class="btn primary" type="button" id="impGo">Rezept auslesen</button><button class="btn" type="button" id="impStop" hidden>Abbrechen</button></div>
    <div id="impOut" aria-live="polite"></div></div>`;
  $("impClose").onclick = () => { if (impCtl) impCtl.abort(); $("dlg").close(); };
  const upd = () => { $("impDup").innerHTML = dupInfo(igCode($("impUrl").value)); };
  $("impUrl").oninput = upd; upd();
  $("impDup").onclick = e => { const b = e.target.closest("[data-open]"); if (b) fromImp(b.dataset.open); };
  $("impGo").onclick = runImport;
  $("impStop").onclick = () => impCtl && impCtl.abort();
  if (!$("dlg").open) $("dlg").showModal();
  (p.url ? $("impTxt") : $("impUrl")).focus();
}
async function runImport() {
  const out = $("impOut"), url0 = $("impUrl").value.trim(), text = $("impTxt").value.trim(), files = [...(($("impImg") || {}).files || [])];
  const code = igCode(url0);
  if (url0 && !code) { out.innerHTML = `<p class="err">Das sieht nicht nach einem Instagram-Link aus. Er sollte /reel/ oder /p/ enthalten.</p>`; $("impUrl").focus(); return; }
  if (text.length < 20 && !files.length) { out.innerHTML = `<p class="err">Bitte die Beschreibung einfügen${impLim && impLim.images ? " oder Screenshots anhängen" : ""}.</p>`; $("impTxt").focus(); return; }
  if (!impSample) { out.innerHTML = `<p class="err">Das Auslesen mit Claude ist in dieser Ansicht nicht verfügbar. Öffne den Katalog in der Claude-App oder auf claude.ai.</p>`; return; }
  const max = impLim && impLim.images ? impLim.images.maxCount : 0;
  if (files.length > max) { out.innerHTML = `<p class="err">Höchstens ${max} Screenshots.</p>`; return; }
  const images = files.length ? await Promise.all(files.map(shrink)) : undefined;
  const url = code ? `https://www.instagram.com/${/\/p\//.test(url0) ? "p" : "reel"}/${code}/` : null;
  const by0 = (url0.match(/instagram\.com\/([A-Za-z0-9_.]+)\/(?:p|reel|reels)\//) || [])[1];
  impCtl = new AbortController(); $("impGo").disabled = true; $("impStop").hidden = false;
  out.innerHTML = `<p class="note">Claude liest das Rezept aus. Das dauert meist 10 bis 60 Sekunden …</p>`;
  try {
    const opts = {signal: impCtl.signal, cache: false}; if (images) opts.images = images;
    const j = await impSample.json(impPrompt(text, files.length), opts);
    if (!j || typeof j !== "object") throw {code: "invalid_json"};
    if (j.ist_rezept === false) { out.innerHTML = `<p class="warn">Darin steht kein Rezept${j.grund ? `: ${esc(j.grund)}` : ""}. Steht es nur im Video, häng Screenshots an.</p>`; return; }
    const d = draftFrom(j, code, url, by0 ? "@" + by0 : "");
    if (!d.t || !d.ing.length) { out.innerHTML = `<p class="warn">Ich habe keine Zutatenliste gefunden. Steht das Rezept nur im Video, häng Screenshots an.</p>`; return; }
    impDraft = d; preview();
  } catch (e) {
    out.innerHTML = e && e.code === "cancelled" ? `<p class="note">Abgebrochen.</p>` : `<p class="err">${esc(impErr(e))}</p>`;
  } finally { impCtl = null; if ($("impGo")) { $("impGo").disabled = false; $("impStop").hidden = true; } }
}
function preview() {
  const d = impDraft, out = $("impOut"), sim = similar(d.t).filter(r => r.id !== d.id);
  const g = role => d.ing.filter(i => i[1] === role).map(i => `<li>${esc(i[0])}</li>`).join("");
  out.innerHTML = `<div class="box" style="margin-top:14px"><h3>Vorschau</h3>
    <label for="impT">Titel</label><input type="text" id="impT" value="${esc(d.t)}" maxlength="120">
    ${sim.length ? `<p class="warn">Ähnlich im Katalog: ${sim.map(r => `<button type="button" class="linkbtn" data-open="${esc(r.id)}">${esc(r.t)}</button>`).join(", ")}</p>` : ""}
    ${d.d ? `<p>${esc(d.d)}</p>` : ""}
    <p class="note">${[d.svt, d.tm ? d.tm + " Min." : "", d.n ? `ca. ${d.n[0]} kcal und ${d.n[1]} g Protein je Portion (geschätzt)` : "", d.ergaenzt ? "fehlende Mengen ergänzt" : ""].filter(Boolean).map(esc).join(" · ")}</p>
    <div>${d.tags.filter(t => !t.startsWith("quelle:")).map(t => `<span class="pill">${esc(L[t] || t)}</span>`).join(" ")}</div>
    ${g("k") ? `<div class="role">Einkaufen</div><ul>${g("k")}</ul>` : ""}${g("o") ? `<div class="role">Optional</div><ul>${g("o")}</ul>` : ""}${g("v") ? `<div class="role">Aus dem Vorrat</div><ul>${g("v")}</ul>` : ""}
    ${d.st.length ? `<div class="role">Zubereitung</div><ol>${d.st.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : `<p class="note">Keine Schritte gefunden.</p>`}
    <div class="acts"><button class="btn primary" type="button" id="impSave">In den Katalog speichern</button><button class="btn" type="button" id="impAgain">Nochmal auslesen</button></div>
    <p class="note" id="impMsg" aria-live="polite"></p></div>`;
  out.onclick = e => { const b = e.target.closest("[data-open]"); if (b) fromImp(b.dataset.open); };
  $("impAgain").onclick = runImport;
  $("impSave").onclick = async () => {
    const t = $("impT").value.trim(); if (!t) { $("impMsg").textContent = "Bitte einen Titel eingeben."; $("impT").focus(); return; }
    const d2 = {...d, t, ing: d.ing.map(i => JSON.stringify(i)), st: d.st};   // verschachtelte Listen als Text speichern
    const dbx = await claude.use("db").catch(() => null);
    if (!dbx) { $("impMsg").textContent = "Speichern geht nur, wenn du angemeldet bist."; return; }
    $("impMsg").textContent = "Speichere …"; $("impSave").disabled = true;
    try {
      await dbx.collection("importe").doc(d.id).set(d2);
      IMP[d.id] = d2; mergeImp(); impDraft = null;
      $("impMsg").innerHTML = `Gespeichert. <button type="button" class="linkbtn" data-open="${esc(d.id)}">Rezept öffnen</button> · <button type="button" class="linkbtn" id="impNext">Nächstes importieren</button>`;
      $("impNext").onclick = () => openImport();
    } catch (e) { $("impMsg").textContent = "Speichern hat nicht geklappt. Bitte nochmal versuchen."; $("impSave").disabled = false; }
  };
  $("impT").focus();
}
$("impOpen").onclick = () => openImport();

/* Importierte Rezepte: Löschen im Rezeptfenster */
const openR0 = openR;
openR = function (r) {
  openR0(r);
  const box = document.querySelector("#dlgbody .dlg-head .row-btns"); if (!box) return;
  if (impBack) { const st = impBack; impBack = null; const bb = document.createElement("button"); bb.type = "button"; bb.className = "btn"; bb.textContent = "Zurück zum Import";
    bb.onclick = () => { openImport(st); if (impDraft) { preview(); if (st.t) $("impT").value = st.t; } }; box.prepend(bb); }
  if (!r || !r.imp) return;
  const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Import löschen"; let arm = false;
  b.onclick = async () => {
    if (!arm) { arm = true; b.textContent = "Wirklich löschen?"; setTimeout(() => { arm = false; b.textContent = "Import löschen"; }, 3000); return; }
    const dbx = await claude.use("db").catch(() => null); if (!dbx) return;
    try { await dbx.collection("importe").doc(r.id).delete(); delete IMP[r.id]; mergeImp(); $("dlg").close(); } catch (e) { b.textContent = "Löschen ging nicht"; }
  };
  box.prepend(b);
};
</script>
